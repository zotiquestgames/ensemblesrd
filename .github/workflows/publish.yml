name: Publish Website

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Nothing to publish until the first text is synced into content/.
      - name: Check content
        id: content
        run: |
          if find content -name '*.md' 2>/dev/null | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "content/ has no texts yet: nothing to publish."
          fi

      - name: Set up Quarto
        if: steps.content.outputs.present == 'true'
        uses: quarto-dev/quarto-actions/setup@v2

      # The publish action runs "quarto publish gh-pages" under the hood.
      # This compiles the website and all defined alternative formats (like Typst PDF, EPUB, Word, OpenDocument, GFM)
      # into the _site/ output directory and deploys it to the gh-pages branch.
      - name: Publish to GitHub Pages
        if: steps.content.outputs.present == 'true'
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}