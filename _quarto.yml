project:
  type: website
  output-dir: _site
  pre-render:
    - scripts/sync_content.py
  render:
    - index.qmd
    - "!content/**"
    # Add one or two globs per collection ("core/*.md"), as in lonersrd.

# website.sidebar lives in _sidebar-auto.yml, regenerated by
# scripts/sync_content.py from content/ on every pre-render -- so newly
# synced pages get a nav entry without a manual edit here.
metadata-files:
  - _sidebar-auto.yml

website:
  title: "Ensemble SRD"
  description: "Ensemble, a narrative-first tabletop RPG engine: free System Reference Document."
  site-url: "https://ensemblesrd.zotiquestgames.com/"
  repo-url: "https://github.com/zotiquestgames/ensemblesrd"
  repo-actions: [issue]

  navbar:
    left:
      - text: "Home"
        href: index.qmd
    right:
      - icon: github
        href: https://github.com/zotiquestgames/ensemblesrd

  page-footer:
    left: "© 2024-2026 [Roberto Bisceglie](https://zotiquestgames.com)"
    right: "Built with [Quarto](https://quarto.org)"

filters:
  - _extensions/gfm-callout.lua
  - _extensions/typst-pagebreak-h1.lua

format:
  html:
    theme:
      light: [materia, assets/custom.scss]
      dark:  [darkly, assets/custom.scss]
    toc: true
    toc-depth: 3
    include-in-header: assets/fonts.html
    include-after-body: assets/format-links-top.html
    format-links:
      - format: typst
        text: PDF
        icon: file-pdf
      - odt
      - epub
      - gfm
